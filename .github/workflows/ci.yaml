name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  dev:
    name: Build dev
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nexuscreator:dev
          target: dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    needs:
      - dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run black
        run: docker compose run format

  linting:
    name: Linting
    runs-on: ubuntu-24.04
    needs:
      - dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run flake8
        run: docker compose run lint

  safety:
    name: Safety
    runs-on: ubuntu-24.04
    needs:
      - dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run safety
        run: docker compose run safety

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    needs:
      - dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Touch coverage.xml
        run: touch coverage.xml

      - name: Run tests
        run: docker compose run tests

  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - formatting
      - linting
      - safety
      - tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_URL }}/nexuscreator_container

      - name: Login to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Tag and push Docker image to Harbor
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: prod
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
